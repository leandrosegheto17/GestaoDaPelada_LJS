# Ambiente local descartável: só o banco. A API (wrangler dev) e o web (Vite) rodam com `pnpm dev`.
# A senha abaixo é fictícia e vale só para esta máquina.
# A imagem oficial postgres:16 traz as extensões contrib; o pgcrypto é criado pela migration.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pelada
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados_db:
