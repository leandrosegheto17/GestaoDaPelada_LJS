services:
  postgres:
    image: postgres:18
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pelada
    volumes:
      - pelada_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pelada']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pelada_pgdata:
