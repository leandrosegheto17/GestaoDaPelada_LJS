# Só o Postgres 18 local (FUN-03). Escuta apenas em 127.0.0.1.
# A imagem oficial já traz o pgcrypto (contrib); as migrações o criam.
name: gestaodapelada

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pelada
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pelada-dados:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pelada']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pelada-dados:
