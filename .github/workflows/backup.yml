# Backup diário cifrado da produção (main do Neon), somente leitura (FUN-47, FUN-49, AD-013).
name: backup

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-producao
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: backup
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar pg_dump 18 e age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18 age
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Conferir a versão do cliente
        run: pg_dump --version | grep -E ' 18\.'

      - name: Dump cifrado da produção
        uses: ./.github/actions/dump-cifrado
        with:
          url: ${{ secrets.NEON_URL_BACKUP }}
          chave-publica: ${{ secrets.BACKUP_CHAVE }}
          saida: ${{ runner.temp }}/backup-producao.age

      - name: Guardar o artefato por 30 dias
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-producao-${{ github.run_id }}
          path: ${{ runner.temp }}/backup-producao.age
          retention-days: 30
          if-no-files-found: error
