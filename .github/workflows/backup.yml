name: backup

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar cliente PostgreSQL 18 e age
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 age
      - name: Dump cifrado
        env:
          DATABASE_URL: ${{ secrets.NEON_URL_BACKUP }}
          BACKUP_CHAVE: ${{ secrets.BACKUP_CHAVE }}
          SAIDA: ${{ runner.temp }}/backup.dump.age
        run: .github/actions/dump-cifrado/dump-cifrado.sh
      - name: Enviar artefato
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup.dump.age
          retention-days: 30
          if-no-files-found: error
