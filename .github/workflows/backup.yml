name: backup

# Backup diário da produção (branch main do Neon), somente leitura, cifrado com age.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: producao
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pg_dump 18 e age
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18 age

      - name: Dump cifrado
        id: dump
        env:
          DUMP_URL: ${{ secrets.NEON_URL_BACKUP }}
          BACKUP_CHAVE: ${{ secrets.BACKUP_CHAVE }}
        run: |
          set -euo pipefail
          arquivo="$RUNNER_TEMP/pelada-main-$(date -u +%Y-%m-%d).dump.age"
          SAIDA="$arquivo" bash .github/actions/dump-cifrado/dump-cifrado.sh
          echo "arquivo=$arquivo" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-producao
          path: ${{ steps.dump.outputs.arquivo }}
          retention-days: 30
          if-no-files-found: error
