name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/preparar-node
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Os testes da API precisam de Postgres e rodam no job `banco`.
      - run: pnpm exec vitest run --dir test
      - run: pnpm -r --filter '!@pelada/api' test
      - run: node backend/scripts/checagens/checar-ids-tarefa.mjs
      - run: node backend/scripts/checagens/checar-urls-absolutas.mjs
      - run: node backend/scripts/checagens/checar-wrangler-deploy.mjs
      - run: node backend/scripts/checagens/checar-acoes-fixadas.mjs
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  banco:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      # Postgres descartável do job; a senha é fictícia, a mesma do docker-compose local.
      DATABASE_URL_TESTE: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-node
      - name: Migrations do zero (fixtures A, B e C, roles e RLS)
        run: pnpm --filter @pelada/api exec vitest run test/migracoes
      - name: Isolamento no banco
        run: pnpm --filter @pelada/api exec vitest run test/isolamento
      - name: Demais testes da API
        run: pnpm --filter @pelada/api exec vitest run --exclude 'test/migracoes/**' --exclude 'test/isolamento/**'

  checagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-node
      - run: pnpm test:checagens
