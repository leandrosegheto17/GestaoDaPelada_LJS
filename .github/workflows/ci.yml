# CI (FUN-40): roda em todo push e PR e falha se qualquer passo falhar. Nenhum passo pode
# seguir depois de um erro. Os testes de banco usam um Postgres 18 de serviço, nunca o Neon (FUN-19).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pelada
  DATABASE_URL_TESTE: postgres://postgres:postgres@127.0.0.1:5432/pelada
  DATABASE_URL_MIGRACAO: postgres://postgres:postgres@127.0.0.1:5432/pelada

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      # A-13 do /validar: dependência de produção com falha alta ou crítica derruba o CI. Os avisos só de dev e teste
      # (miniflare, esbuild) seguem na AD-134.
      - name: Auditoria das dependências de produção
        run: pnpm audit --prod --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Checagens do repositório
        run: |
          set -euo pipefail
          node backend/scripts/checagens/actions-por-sha.ts
          node backend/scripts/checagens/wrangler-unico.ts
          node backend/scripts/checagens/env-example.ts
          node backend/scripts/checagens/sem-url-absoluta.ts
          node backend/scripts/checagens/migracao-aditiva.ts
          node backend/scripts/checagens/email-dev.ts
          node backend/scripts/checagens/push-hosts-dev.ts
          node backend/scripts/checagens/sem-e-dono.ts
          node backend/scripts/checagens/escritores-periodo.ts
          node backend/scripts/checagens/plano-unico.ts
          node backend/scripts/checagens/chave-asaas.ts
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  testes:
    name: testes (${{ matrix.nome }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A suíte em 3 jobs paralelos, cada um com o próprio banco de serviço: o api (o mais longo) fica dividido nos dois
    # projetos do vitest, e o resto roda junto com os testes das checagens (FUN-40).
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: api-banco
            comando: pnpm --filter @pelada/api exec vitest run --project banco
          - nome: api-worker
            comando: pnpm --filter @pelada/api exec vitest run --project worker
          - nome: demais
            comando: pnpm exec vitest run --dir test && pnpm -r --filter '!@pelada/api' test && pnpm test:checagens
    env:
      # Senha fictícia só do CI: o /api/health não toca o banco, mas o wrangler dev exige a URL do Hyperdrive local com senha.
      PELADA_APP_SENHA: senha-ficticia-do-ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pelada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pelada"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Instalar o pg_dump 18
        # O banco de serviço é o Postgres 18; o runner traz o pg_dump 16 no PATH e o teste do dump com a role de backup
        # (NOT-58) exige a mesma versão do servidor. Instala o cliente 18 e o põe na frente do PATH.
        if: matrix.nome == 'api-banco'
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 3; done
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -E ' 18\.'
      - name: Testes
        run: ${{ matrix.comando }}

  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pelada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pelada"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Migrar do zero
        run: pnpm migrar
      - name: Migrar de novo (zero DDL)
        run: pnpm migrar
      - name: Impressão digital do schema e estado do banco
        run: pnpm --filter @pelada/api exec vitest run test/migracoes
      - name: Isolamento (RLS por comando)
        run: pnpm --filter @pelada/api exec vitest run test/isolamento

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # e2e em 3 fatias em paralelo, cada uma com o próprio banco de serviço (FUN-40).
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    env:
      # Senhas fictícias só do CI. O e2e das jornadas usa o banco de serviço: o `pnpm seed` cria as roles com elas e o
      # wrangler dev conecta como `pelada_app` pela URL do Hyperdrive local.
      PELADA_APP_SENHA: senha-ficticia-do-ci
      PELADA_BACKUP_RO_SENHA: senha-ficticia-backup-do-ci
      SEED_SENHA_ADMIN: senha-ficticia-admin-ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pelada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pelada"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Migrar e semear o banco do e2e
        run: pnpm migrar && pnpm seed
      - name: Instalar o Chromium do Playwright
        # O apt e o download às vezes travam no runner (uma fatia ficou parada por mais de 6 min): cada tentativa tem
        # 180 s e há até 3.
        run: |
          for tentativa in 1 2 3; do
            # O runner às vezes mantém o apt ocupado em segundo plano (lock do dpkg): espera soltar.
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 3; done
            timeout 180 pnpm --filter @pelada/web exec playwright install --with-deps chromium && exit 0
            echo "Tentativa $tentativa falhou ou passou de 180 s"
            sleep 5
          done
          exit 1
      - name: Build do web
        run: pnpm --filter @pelada/web build
      - name: e2e (instalabilidade e cabeçalhos)
        run: pnpm --filter @pelada/web exec playwright test --shard=${{ matrix.shard }}
      - name: Relatório do Playwright e prints da comparação
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-falha-${{ strategy.job-index }}-${{ github.run_id }}
          path: |
            frontend/web/playwright-report
            frontend/web/test-results
          retention-days: 7
          if-no-files-found: ignore
