# CI (FUN-40): roda em todo push e PR e falha se qualquer passo falhar. Nenhum passo pode
# seguir depois de um erro. Os testes de banco usam um Postgres 18 de serviço, nunca o Neon (FUN-19).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pelada
  DATABASE_URL_TESTE: postgres://postgres:postgres@127.0.0.1:5432/pelada
  DATABASE_URL_MIGRACAO: postgres://postgres:postgres@127.0.0.1:5432/pelada

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Checagens do repositório
        run: |
          set -euo pipefail
          node backend/scripts/checagens/actions-por-sha.ts
          node backend/scripts/checagens/wrangler-unico.ts
          node backend/scripts/checagens/env-example.ts
          node backend/scripts/checagens/sem-url-absoluta.ts
          node backend/scripts/checagens/migracao-aditiva.ts
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pelada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pelada"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Testes
        run: pnpm test
      - name: Testes das checagens
        run: pnpm test:checagens

  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pelada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pelada"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Migrar do zero
        run: pnpm migrar
      - name: Migrar de novo (zero DDL)
        run: pnpm migrar
      - name: Impressão digital do schema e estado do banco
        run: pnpm --filter @pelada/api exec vitest run test/migracoes
      - name: Isolamento (RLS por comando)
        run: pnpm --filter @pelada/api exec vitest run test/isolamento
