# Varredura de segredos (FUN-46): as regras padrão do gitleaks, mais as exceções abaixo.
title = "Gestão da Pelada"

[extend]
useDefault = true

[allowlist]
description = "Valores de desenvolvimento local e documentação, sem segredo real."
paths = [
  '''pnpm-lock\.yaml''',
  '''\.specs/''',
  '''\.claude/''',
  '''\.rascunho/''',
]
# O usuário e a senha do Postgres do docker compose local (postgres:postgres) não são segredo.
regexes = [
  '''postgres://postgres:postgres@127\.0\.0\.1''',
]

# Chave da API do Asaas (planos-e-cobranca T40; PLA-37): o prefixo seguido do texto da chave. A mesma regra é a
# checagem chave-asaas.
[[rules]]
id = "asaas-api-key"
description = "Chave da API do Asaas"
regex = '''\$aact_[A-Za-z0-9+/=_-]{40,}'''
keywords = ["aact_"]
