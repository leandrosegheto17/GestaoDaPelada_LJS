<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alterar data de início de Toninho</title>
<link rel="stylesheet" href="../../../../mockup/fontes/fontes.css">
<link rel="stylesheet" href="../../../../mockup/tokens.css">
<link rel="stylesheet" href="../../../../mockup/base.css">
</head>
<body>
<!-- Diálogo "Alterar data de início" (recuar a data, prévia pronta). Recorte em .dialogo. -->
<header class="barra barra--admin" aria-hidden="true"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<div class="veu">
  <section class="dialogo" role="dialog" aria-modal="true" aria-labelledby="ini-t">
    <button class="dialogo__fechar" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h2 id="ini-t" class="dialogo__titulo">Alterar data de início</h2>
    <p class="dialogo__texto">Data de início atual de Toninho: 05/02/2026.</p>
    <div class="campo"><label class="campo__rotulo" for="inicio">Data de início</label><input class="campo__entrada" id="inicio" type="date" max="2026-10-22" value="2026-01-15" aria-describedby="ini-ajuda"><p class="campo__ajuda" id="ini-ajuda">A pontuação do jogador conta a partir desta data. Nada é apagado: voltar a data devolve os pontos.</p></div>
    <div aria-live="polite"><p class="paragrafo">Acumulado de 18 pontos passa a 24; posição de 5 para 3. 2 rodadas passam a constar.</p></div>
    <div class="dialogo__acoes"><button class="botao botao--secundario" type="button">Cancelar</button><button class="botao botao--principal" type="button">Confirmar nova data</button></div>
  </section>
</div>
</body>
</html>
