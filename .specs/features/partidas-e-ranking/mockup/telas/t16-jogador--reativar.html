<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reativar Beto</title>
<link rel="stylesheet" href="../../../../mockup/fontes/fontes.css">
<link rel="stylesheet" href="../../../../mockup/tokens.css">
<link rel="stylesheet" href="../../../../mockup/base.css">
</head>
<body>
<!-- Diálogo "Reativar" (Beto, inativo desde 05/10/2026). Data de retorno com o padrão de hoje: sem prévia, "Reativar" habilitado (um toque, como antes). Recorte em .dialogo. -->
<header class="barra barra--admin" aria-hidden="true"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<div class="veu">
  <section class="dialogo" role="dialog" aria-modal="true" aria-labelledby="re-t">
    <button class="dialogo__fechar" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h2 id="re-t" class="dialogo__titulo">Reativar Beto</h2>
    <p class="dialogo__texto">Volta a aparecer no ranking e nas partidas; a data de início não muda.</p>
    <div class="campo"><label class="campo__rotulo" for="retorno">Data de retorno</label><input class="campo__entrada" id="retorno" type="date" max="2026-10-22" value="2026-10-22" aria-describedby="re-ajuda"><p class="campo__ajuda" id="re-ajuda">Pode ser uma data que já passou, se ele voltou a jogar antes de você registrar. Não pode ser antes da saída anterior (05/10/2026).</p></div>
    <div aria-live="polite"><p class="paragrafo"></p></div>
    <div class="dialogo__acoes"><a class="botao botao--secundario" href="t16-jogador--inativo.html">Cancelar</a><a class="botao botao--principal" href="t16-jogador--reativado.html">Reativar</a></div>
  </section>
</div>
</body>
</html>
