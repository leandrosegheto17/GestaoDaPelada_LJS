<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novo grupo (corrigir)</title>
<link rel="stylesheet" href="../../../../mockup/fontes/fontes.css">
<link rel="stylesheet" href="../../../../mockup/tokens.css">
<link rel="stylesheet" href="../../../../mockup/base.css">
</head>
<body>
<!-- GEL-03, GEL-06, GEL-118: 422 com dois campos. O horário ficou incompleto no seletor (o valor enviado sai fora do formato HH:MM), daí "Horário inválido."; vazio, a mensagem seria "Informe o horário.". -->
<header class="barra barra--admin"><div class="barra__grupo"><span class="barra__nome">Gestão da Pelada</span></div><nav class="barra__acoes" aria-label="Atalhos"><a class="botao-icone botao-icone--sem-borda" href="../../../../mockup/telas/t09-inicio--menu-conta.html" aria-label="Menu da conta"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a></nav></header>
<main class="conteudo conteudo--admin conteudo--estreito">
  <a class="voltar" href="t08-grupos--sucesso.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>Seus grupos</a>
  <h1 class="titulo-pagina">Novo grupo</h1>
  <form class="formulario" novalidate>
    <div class="faixa faixa--erro resumo-erros" role="alert"><div class="faixa__texto"><strong>Corrija 2 campos:</strong><ul><li><a href="#nome">Nome</a></li><li><a href="#hora">Horário</a></li></ul></div></div>
    <div class="campo campo--erro"><label class="campo__rotulo" for="nome">Nome</label><input class="campo__entrada" id="nome" value="Ra" maxlength="60" aria-invalid="true" aria-describedby="nome-ajuda nome-erro"><p class="campo__ajuda" id="nome-ajuda">O link do ranking será criado a partir do nome e não muda depois.</p><p class="campo__erro" id="nome-erro"><svg class="icone" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>O nome precisa ter de 3 a 60 caracteres.</p></div>
    <div class="duas-colunas">
      <div class="campo"><label class="campo__rotulo" for="dia">Dia da semana</label><select class="campo__entrada" id="dia"><option>Domingo</option><option>Segunda</option><option>Terça</option><option>Quarta</option><option selected>Quinta</option><option>Sexta</option><option>Sábado</option></select></div>
      <div class="campo campo--erro"><label class="campo__rotulo" for="hora">Horário</label><input class="campo__entrada" id="hora" type="time" aria-invalid="true" aria-describedby="hora-erro"><p class="campo__erro" id="hora-erro"><svg class="icone" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Horário inválido.</p></div>
    </div>
    <fieldset class="segmentado"><legend class="campo__rotulo">Frequência</legend><label><input type="radio" name="freq" checked><span>Semanal</span></label><label><input type="radio" name="freq"><span>Quinzenal</span></label><label><input type="radio" name="freq"><span>Mensal</span></label></fieldset>
    <div class="barra-acao"><button class="botao botao--principal" type="submit">Criar grupo</button></div>
  </form>
</main>
</body>
</html>
