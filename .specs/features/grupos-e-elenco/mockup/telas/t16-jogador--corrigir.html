<!-- GEL-71: corrigir o retorno do período aberto de Gil (20/10/2026 para 12/10/2026), sem prévia (C7): o botão confirma direto. Recorte em .dialogo. -->
<header class="barra barra--admin" aria-hidden="true"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<div class="veu">
  <section class="dialogo" role="dialog" aria-modal="true" aria-labelledby="co-t">
    <h2 id="co-t" class="dialogo__titulo">Corrigir datas</h2>
    <p class="dialogo__texto">Retorno de Gil: 20/10/2026 <span aria-hidden="true">→</span><span class="sr">até</span> atual.</p>
    <div class="campo"><label class="campo__rotulo" for="retorno">Data de retorno</label><input class="campo__entrada" id="retorno" type="date" max="2026-10-22" value="2026-10-12" aria-describedby="co-ajuda"><p class="campo__ajuda" id="co-ajuda">Ele volta a aparecer nas partidas a partir desta data. Não pode ser antes da saída anterior (05/10/2026).</p></div>
    <div class="dialogo__acoes"><a class="botao botao--secundario" href="../../../../mockup/telas/t16-jogador--periodos.html">Cancelar</a><a class="botao botao--principal" href="t16-jogador--corrigido.html">Confirmar novas datas</a></div>
  </section>
</div>
