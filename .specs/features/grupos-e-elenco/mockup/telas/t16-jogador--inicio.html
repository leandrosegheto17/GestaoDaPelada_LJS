<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alterar data de início</title>
<link rel="stylesheet" href="../../../../mockup/fontes/fontes.css">
<link rel="stylesheet" href="../../../../mockup/tokens.css">
<link rel="stylesheet" href="../../../../mockup/base.css">
</head>
<body>
<!-- GEL-77, GEL-81: Toninho recua a data de início de 05/02/2026 para 15/01/2026, sem prévia (C7). A data atual aparece no texto, já que não há prévia. Recorte em .dialogo. -->
<header class="barra barra--admin" aria-hidden="true"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<div class="veu">
  <section class="dialogo" role="dialog" aria-modal="true" aria-labelledby="ini-t">
    <h2 id="ini-t" class="dialogo__titulo">Alterar data de início</h2>
    <p class="dialogo__texto">Data de início atual de Toninho: 05/02/2026.</p>
    <div class="campo"><label class="campo__rotulo" for="inicio">Data de início</label><input class="campo__entrada" id="inicio" type="date" min="2000-01-01" max="2026-10-22" value="2026-01-15" aria-describedby="ini-ajuda"><p class="campo__ajuda" id="ini-ajuda">A pontuação do jogador conta a partir desta data. Nada é apagado: voltar a data devolve os pontos.</p></div>
    <div class="dialogo__acoes"><a class="botao botao--secundario" href="t16-jogador--edicao.html">Cancelar</a><button class="botao botao--principal" type="button">Confirmar nova data</button></div>
  </section>
</div>
</body>
</html>
