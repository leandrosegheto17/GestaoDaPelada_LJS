<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova senha</title>
<link rel="stylesheet" href="../../../../mockup/fontes/fontes.css">
<link rel="stylesheet" href="../../../../mockup/tokens.css">
<link rel="stylesheet" href="../../../../mockup/base.css">
</head>
<body>
<!-- Muda: vem do link de recuperação (#t=), não da senha temporária. ACE-24. -->
<header class="barra"><p class="barra__titulo">Gestão da Pelada</p></header>
<main class="conteudo conteudo--estreito">
  <h1 class="titulo-pagina">Crie uma nova senha</h1>
  <p class="paragrafo">Depois de salvar, todos os aparelhos conectados à sua conta saem e você entra de novo com a senha nova.</p>
  <form class="formulario" novalidate>
    <div class="campo"><label class="campo__rotulo" for="nova">Nova senha</label><input class="campo__entrada" id="nova" type="password" autocomplete="new-password" aria-describedby="nova-ajuda"><p class="campo__ajuda" id="nova-ajuda">De 8 a 72 caracteres.</p></div><div class="campo"><label class="campo__rotulo" for="conf">Confirmar nova senha</label><input class="campo__entrada" id="conf" type="password" autocomplete="new-password"></div>
    <button class="botao botao--principal botao--bloco" type="submit">Salvar nova senha</button>
  </form>
</main>
</body>
</html>
