<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar (senha alterada)</title>
<link rel="stylesheet" href="../../../../mockup/fontes/fontes.css">
<link rel="stylesheet" href="../../../../mockup/tokens.css">
<link rel="stylesheet" href="../../../../mockup/base.css">
</head>
<body>
<!-- ACE-24: depois de salvar, a tela vai para /entrar com o aviso. -->
<header class="barra"><p class="barra__titulo">Gestão da Pelada</p></header>
<main class="conteudo conteudo--estreito">
  <h1 class="titulo-pagina">Entrar</h1>
  <div class="faixa faixa--sucesso" role="status"><svg class="icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg><p class="faixa__texto">Senha alterada. Entre com a nova senha.</p></div>
  <form class="formulario" novalidate>
    <div class="campo"><label class="campo__rotulo" for="email">E-mail</label><input class="campo__entrada" id="email" type="email" autocomplete="username" inputmode="email"></div>
    <div class="campo"><label class="campo__rotulo" for="senha">Senha</label><div class="campo__linha"><input class="campo__entrada" id="senha" type="password" autocomplete="current-password"><button class="botao botao--secundario" type="button" aria-pressed="false" aria-controls="senha">Mostrar</button></div></div>
    <button class="botao botao--principal botao--bloco" type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
