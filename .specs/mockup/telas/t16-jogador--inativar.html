<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inativar Toninho</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- Diálogo de inativação com a data de saída (RF-21). Recorte em .dialogo. -->
<header class="barra barra--admin" aria-hidden="true"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<div class="veu">
  <section class="dialogo" role="dialog" aria-modal="true" aria-labelledby="in-t">
    <h2 id="in-t" class="dialogo__titulo">Inativar Toninho</h2>
    <p class="dialogo__texto">Ele sai do ranking, do lançamento, do simulador e do financeiro a partir da data de saída. O histórico e os pontos ficam guardados.</p>
    <div class="campo"><label class="campo__rotulo" for="saida">Data de saída</label><input class="campo__entrada" id="saida" type="date" value="2026-10-22"></div>
    <div class="dialogo__acoes"><button class="botao botao--secundario" type="button">Cancelar</button><button class="botao botao--principal" type="button">Inativar</button></div>
  </section>
</div>
</body>
</html>
