<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha senha</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<header class="barra barra--admin"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<main class="conteudo conteudo--admin conteudo--estreito">
  <a class="voltar" href="t09-inicio--sucesso.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>Início</a>
  <h1 class="titulo-pagina">Minha senha</h1>
  <form class="formulario" novalidate>
    <div class="campo"><label class="campo__rotulo" for="atual">Senha atual</label><input class="campo__entrada" id="atual" type="password" autocomplete="current-password"></div>
    <div class="campo"><label class="campo__rotulo" for="nova">Nova senha</label><input class="campo__entrada" id="nova" type="password" autocomplete="new-password" aria-describedby="nova-ajuda"><p class="campo__ajuda" id="nova-ajuda">De 8 a 72 caracteres.</p></div>
    <div class="campo"><label class="campo__rotulo" for="conf">Confirmar nova senha</label><input class="campo__entrada" id="conf" type="password" autocomplete="new-password"></div>
    <div><button class="botao botao--principal" type="submit">Trocar senha</button></div>
  </form>
</main>
</body>
</html>
