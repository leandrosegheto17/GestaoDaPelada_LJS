<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descartar seus ajustes?</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- D2 ao tocar em "Refazer sugestão" depois de ajustes manuais (T13 e T14). Recorte em .dialogo. -->
<header class="barra barra--admin" aria-hidden="true"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<div class="veu">
  <section class="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="d2-t" aria-describedby="d2-x">
    <button class="dialogo__fechar" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h2 id="d2-t" class="dialogo__titulo">Descartar seus ajustes?</h2>
    <p id="d2-x" class="dialogo__texto">A sugestão será refeita do zero com as mesmas entradas.</p>
    <div class="dialogo__acoes"><button class="botao botao--secundario" type="button">Cancelar</button><button class="botao botao--destrutivo" type="button">Refazer sugestão</button></div>
  </section>
</div>
</body>
</html>
