<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novo lançamento (corrigir)</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<header class="barra barra--admin"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span><a class="barra__link" href="t08-grupos--sucesso.html">Trocar grupo</a></div></header>
<main class="conteudo conteudo--admin conteudo--estreito">
  <a class="voltar" href="t22-financeiro--sucesso.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>Financeiro</a>
  <h1 class="titulo-pagina">Novo lançamento</h1>
  <form class="formulario" novalidate>
    <div class="faixa faixa--erro resumo-erros" role="alert"><div class="faixa__texto"><strong>Corrija 2 campos:</strong><ul><li><a href="#desc">Descrição</a></li><li><a href="#valor">Valor</a></li></ul></div></div>
    <fieldset class="segmentado"><legend class="sr">Tipo</legend><label><input type="radio" name="tipo"><span>Entrada</span></label><label><input type="radio" name="tipo" checked><span>Saída</span></label></fieldset>
    <div class="campo"><label class="campo__rotulo" for="data">Data</label><input class="campo__entrada" id="data" type="date" value="2026-10-22"></div>
    <div class="campo campo--erro"><label class="campo__rotulo" for="desc">Descrição</label><input class="campo__entrada" id="desc" maxlength="80" aria-invalid="true" aria-describedby="desc-cont desc-erro"><p class="campo__ajuda" id="desc-cont">0 de 80</p><p class="campo__erro" id="desc-erro"><svg class="icone" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Informe a descrição.</p></div>
    <div class="campo campo--erro"><label class="campo__rotulo" for="valor">Valor (R$)</label><input class="campo__entrada" id="valor" inputmode="decimal" value="0,00" aria-invalid="true" aria-describedby="valor-erro"><p class="campo__erro" id="valor-erro"><svg class="icone" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>O valor precisa ser maior que zero.</p></div>
    <div class="barra-acao"><button class="botao botao--principal" type="submit">Salvar</button></div>
  </form>
</main>
</body>
</html>
