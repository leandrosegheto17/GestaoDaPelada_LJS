<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alterar data de início de Toninho</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- Diálogo "Alterar data de início" (data igual à atual: confirmar desabilitado). Recorte em .dialogo. -->
<header class="barra barra--admin" aria-hidden="true"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<div class="veu">
  <section class="dialogo" role="dialog" aria-modal="true" aria-labelledby="ini-t">
    <button class="dialogo__fechar" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h2 id="ini-t" class="dialogo__titulo">Alterar data de início</h2>
    <div class="campo"><label class="campo__rotulo" for="inicio">Data de início</label><input class="campo__entrada" id="inicio" type="date" max="2026-10-22" value="2026-02-05" aria-describedby="ini-ajuda"><p class="campo__ajuda" id="ini-ajuda">A pontuação do jogador conta a partir desta data. Nada é apagado: voltar a data devolve os pontos.</p></div>
    <div aria-live="polite"><p class="paragrafo">Nada a alterar.</p></div>
    <div class="dialogo__acoes"><button class="botao botao--secundario" type="button">Cancelar</button><button class="botao botao--principal" type="button" disabled>Confirmar nova data</button></div>
  </section>
</div>
</body>
</html>
