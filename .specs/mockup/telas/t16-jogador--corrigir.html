<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrigir datas de Gil</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- Diálogo "Corrigir datas" do período aberto (retorno de 20/10/2026), data igual à atual: confirmar desabilitado. Recorte em .dialogo. -->
<header class="barra barra--admin" aria-hidden="true"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<div class="veu">
  <section class="dialogo" role="dialog" aria-modal="true" aria-labelledby="co-t">
    <h2 id="co-t" class="dialogo__titulo">Corrigir datas</h2>
    <p class="dialogo__texto">Retorno de Gil: 20/10/2026 <span aria-hidden="true">→</span><span class="sr">até</span> atual.</p>
    <div class="campo"><label class="campo__rotulo" for="retorno">Data de retorno</label><input class="campo__entrada" id="retorno" type="date" max="2026-10-22" value="2026-10-20" aria-describedby="co-ajuda"><p class="campo__ajuda" id="co-ajuda">Ele volta a aparecer nas partidas a partir desta data. Não pode ser antes da saída anterior (05/10/2026).</p></div>
    <div aria-live="polite"><p class="paragrafo">Nada a alterar.</p></div>
    <div class="dialogo__acoes"><button class="botao botao--secundario" type="button">Cancelar</button><button class="botao botao--principal" type="button" disabled>Confirmar novas datas</button></div>
  </section>
</div>
</body>
</html>
