<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criar conta</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- ACE-01, ACE-59: aceite desmarcado por padrão. -->
<header class="barra"><p class="barra__titulo">Gestão da Pelada</p></header>
<main class="conteudo conteudo--estreito">
  <a class="voltar" href="t04-entrar--vazio.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>Voltar para entrar</a>
  <h1 class="titulo-pagina">Criar conta</h1>
  <p class="paragrafo">Organize presença, times e ranking da sua pelada. Grátis para começar.</p>
  <form class="formulario" novalidate>
    <div class="campo"><label class="campo__rotulo" for="nome">Seu nome</label><input class="campo__entrada" id="nome" autocomplete="name" aria-describedby="nome-ajuda"><p class="campo__ajuda" id="nome-ajuda">Como os outros admins vão ver você.</p></div><div class="campo"><label class="campo__rotulo" for="email">E-mail</label><input class="campo__entrada" id="email" type="email" autocomplete="username" inputmode="email"></div><div class="campo"><label class="campo__rotulo" for="senha">Senha</label><input class="campo__entrada" id="senha" type="password" autocomplete="new-password" aria-describedby="senha-ajuda"><p class="campo__ajuda" id="senha-ajuda">De 8 a 72 caracteres.</p></div><div class="campo"><label class="caixa"><input type="checkbox" id="termos"><span>Li e aceito os <a href="t33-termos--pagina.html">termos de uso</a> e a <a href="t07-privacidade--pagina.html">política de privacidade</a></span></label></div><button class="botao botao--principal botao--bloco" type="submit">Criar conta</button><a class="botao botao--texto" href="t04-entrar--vazio.html">Já tenho conta</a>
  </form>
</main>
</body>
</html>
