<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carregando o ranking</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- T01 na 1ª visita do aparelho (sem cache local): esqueleto depois de 300 ms. -->
<header class="barra">
  <div><span class="esqueleto esqueleto--na-barra" aria-hidden="true"></span></div>
</header>
<main class="conteudo" aria-busy="true">
  <p class="sr" role="status">Carregando o ranking…</p>
  <span class="esqueleto esqueleto--mes" aria-hidden="true"></span>
  <div class="tabela-rolagem" aria-hidden="true">
    <span class="esqueleto esqueleto--linha-tabela"></span><span class="esqueleto esqueleto--linha-tabela"></span><span class="esqueleto esqueleto--linha-tabela"></span><span class="esqueleto esqueleto--linha-tabela"></span><span class="esqueleto esqueleto--linha-tabela"></span><span class="esqueleto esqueleto--linha-tabela"></span><span class="esqueleto esqueleto--linha-tabela"></span><span class="esqueleto esqueleto--linha-tabela"></span><span class="esqueleto esqueleto--linha-tabela"></span><span class="esqueleto esqueleto--linha-tabela"></span>
  </div>
</main>
</body>
</html>
