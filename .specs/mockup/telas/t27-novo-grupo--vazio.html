<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novo grupo</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<header class="barra barra--dono"><div class="barra__grupo"><span class="barra__nome">Área do dono</span></div></header>
<main class="conteudo conteudo--admin conteudo--estreito">
  <a class="voltar" href="t26-dono--sucesso.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>Área do dono</a>
  <h1 class="titulo-pagina">Novo grupo</h1>
  <form class="formulario" novalidate>
    <div class="campo"><label class="campo__rotulo" for="nome">Nome do grupo</label><input class="campo__entrada" id="nome" maxlength="60" aria-describedby="nome-ajuda"><p class="campo__ajuda" id="nome-ajuda">O link do ranking será criado a partir do nome e não muda depois.</p></div>
    <div class="duas-colunas">
      <div class="campo"><label class="campo__rotulo" for="dia">Dia da semana</label><select class="campo__entrada" id="dia"><option value="">Escolha</option><option>Domingo</option><option>Segunda</option><option>Terça</option><option>Quarta</option><option>Quinta</option><option>Sexta</option><option>Sábado</option></select></div>
      <div class="campo"><label class="campo__rotulo" for="hora">Horário</label><input class="campo__entrada" id="hora" type="time"></div>
    </div>
    <fieldset class="segmentado"><legend class="campo__rotulo">Frequência</legend><label><input type="radio" name="freq" checked><span>Semanal</span></label><label><input type="radio" name="freq"><span>Quinzenal</span></label><label><input type="radio" name="freq"><span>Mensal</span></label></fieldset>
    <h2 class="subtitulo">Primeiro admin</h2>
    <div class="campo"><label class="campo__rotulo" for="anome">Nome</label><input class="campo__entrada" id="anome"></div>
    <div class="campo"><label class="campo__rotulo" for="aemail">E-mail</label><input class="campo__entrada" id="aemail" type="email" aria-describedby="aemail-ajuda"><p class="campo__ajuda" id="aemail-ajuda">Se o e-mail já for de um admin, ele só é vinculado ao grupo.</p></div>
    <div class="barra-acao"><a class="botao botao--principal" href="t27-novo-grupo--senha.html">Criar grupo</a></div>
  </form>
</main>
</body>
</html>
