<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trocar Japa com…</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- D3, passo "Trocar com…": mesma folha, uma opção por jogador, agrupada pelo destino atual (ordem da tela). "Voltar" retorna ao D3. Recorte em .folha. -->
<header class="barra barra--admin" aria-hidden="true"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span></div></header>
<main class="conteudo conteudo--admin" aria-hidden="true"><p class="titulo-pagina">Times sugeridos</p></main>
<div class="veu veu--folha">
  <section class="folha" role="dialog" aria-modal="true" aria-labelledby="d3-t">
    <h2 id="d3-t" class="folha__titulo">Trocar Japa com…</h2>
    <section><h3 class="cartao-time__grupo">Time A · Titulares</h3><ul class="folha__opcoes">
      <li><button class="folha__opcao" type="button">Toninho</button></li>
      <li><button class="folha__opcao" type="button">Careca</button></li>
    </ul></section>
    <section><h3 class="cartao-time__grupo">Time A · Entram no 2º tempo</h3><ul class="folha__opcoes">
      <li><button class="folha__opcao" type="button">Cabeça</button></li>
    </ul></section>
    <section><h3 class="cartao-time__grupo">Time B · Titulares</h3><ul class="folha__opcoes">
      <li><button class="folha__opcao" type="button">Bigode</button></li>
    </ul></section>
    <section><h3 class="cartao-time__grupo">Time B · Entram no 2º tempo</h3><ul class="folha__opcoes">
      <li><button class="folha__opcao" type="button">Vini</button></li>
    </ul></section>
    <section><h3 class="cartao-time__grupo">Não entra</h3><ul class="folha__opcoes">
      <li><button class="folha__opcao" type="button">Serginho</button></li>
    </ul></section>
    <ul class="folha__opcoes">
      <li><button class="folha__opcao" type="button">Voltar</button></li>
    </ul>
  </section>
</div>
</body>
</html>
