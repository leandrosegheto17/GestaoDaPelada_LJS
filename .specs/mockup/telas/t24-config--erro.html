<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Configurar caixa (corrigir)</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<header class="barra barra--admin"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span><a class="barra__link" href="t08-grupos--sucesso.html">Trocar grupo</a></div></header>
<main class="conteudo conteudo--admin conteudo--estreito">
  <a class="voltar" href="t22-financeiro--sucesso.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>Financeiro</a>
  <h1 class="titulo-pagina">Configurar caixa</h1>
  <form class="formulario" novalidate>
    <div class="campo"><label class="campo__rotulo" for="mens">Mensalidade (opcional, R$)</label><input class="campo__entrada" id="mens" inputmode="decimal" value="75,00"></div>
    <div class="duas-colunas">
      <div class="campo campo--erro"><label class="campo__rotulo" for="saldo">Saldo inicial (R$)</label><input class="campo__entrada" id="saldo" inputmode="decimal" value="mil" aria-invalid="true" aria-describedby="saldo-erro"><p class="campo__erro" id="saldo-erro" role="alert"><svg class="icone" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Informe um valor em reais, ex.: 350,00.</p></div>
      <div class="campo"><label class="campo__rotulo" for="data">Data do saldo inicial</label><input class="campo__entrada" id="data" type="date" value="2026-02-05"></div>
    </div>
    <div class="barra-acao"><button class="botao botao--principal" type="submit">Salvar</button></div>
  </form>
</main>
</body>
</html>
