<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranking: Pelada de Quinta (PDF pronto: compartilhar ou baixar)</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- D4 sobre T01: aparece quando o navegador recusou o compartilhamento direto (perda do gesto). Comparação por recorte em .dialogo. -->
<header class="barra" aria-hidden="true">
  <div><p class="barra__titulo">Pelada de Quinta</p><p class="barra__sub">Toda quinta · 20:00</p></div>
</header>
<main class="conteudo" aria-hidden="true"><p class="resumo-mes"><strong>3 partidas</strong> no mês, 1 com chuva.</p></main>
<div class="veu">
  <section class="dialogo" role="dialog" aria-modal="true" aria-labelledby="d4-titulo">
    <h2 id="d4-titulo" class="dialogo__titulo">PDF pronto.</h2>
    <p class="dialogo__texto">Ranking de outubro de 2026 da Pelada de Quinta.</p>
    <div class="dialogo__acoes">
      <button class="botao botao--secundario" type="button">Baixar</button>
      <button class="botao botao--principal" type="button">Compartilhar</button>
    </div>
  </section>
</div>
</body>
</html>
