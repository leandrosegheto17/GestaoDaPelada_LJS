<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novo jogador (corrigir)</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<header class="barra barra--admin"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span><a class="barra__link" href="t08-grupos--sucesso.html">Trocar grupo</a></div></header>
<main class="conteudo conteudo--admin conteudo--estreito">
  <a class="voltar" href="t15-jogadores--sucesso.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>Jogadores</a>
  <h1 class="titulo-pagina">Novo jogador</h1>
  <form class="formulario" novalidate>
    <div class="faixa faixa--erro resumo-erros" role="alert"><div class="faixa__texto"><strong>Corrija 2 campos:</strong><ul><li><a href="#apelido">Apelido</a></li><li><a href="#ano">Ano de nascimento</a></li></ul></div></div>
    <div class="campo campo--erro"><label class="campo__rotulo" for="apelido">Apelido</label><input class="campo__entrada" id="apelido" maxlength="30" value="japa" aria-invalid="true" aria-describedby="apelido-ajuda apelido-erro"><p class="campo__ajuda" id="apelido-ajuda">De 2 a 30 caracteres. É o nome que aparece no ranking.</p><p class="campo__erro" id="apelido-erro"><svg class="icone" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Já existe um jogador com esse apelido neste grupo.</p></div>
    <div class="duas-colunas">
      <div class="campo campo--erro"><label class="campo__rotulo" for="ano">Ano de nascimento</label><input class="campo__entrada" id="ano" type="number" inputmode="numeric" value="2020" aria-invalid="true" aria-describedby="ano-erro"><p class="campo__erro" id="ano-erro"><svg class="icone" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>O ano precisa estar entre 1940 e 2016.</p></div>
      <div class="campo"><label class="campo__rotulo" for="pos">Posição</label><select class="campo__entrada" id="pos"><option>Zagueiro</option><option>Lateral</option><option>Volante</option><option selected>Meia</option><option>Atacante</option><option>Centroavante</option><option>Goleiro</option></select></div>
    </div>
    <div class="duas-colunas">
      <div class="campo"><label class="campo__rotulo" for="tel">Telefone (opcional)</label><input class="campo__entrada" id="tel" type="tel" inputmode="tel"></div>
      <div class="campo"><label class="campo__rotulo" for="entrada">Data de entrada</label><input class="campo__entrada" id="entrada" type="date" value="2026-10-22"></div>
      <div class="campo"><label class="campo__rotulo" for="inicial">Pontuação inicial</label><input class="campo__entrada" id="inicial" type="number" inputmode="numeric" min="0" max="9999" step="1" value="0"></div>
    </div>
    <div class="barra-acao"><button class="botao botao--principal" type="submit">Salvar</button></div>
  </form>
</main>
</body>
</html>
