<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Times sugeridos (falha ao confirmar)</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">

</head>
<body>
<!-- Falha ao gravar a escalação: a composição fica na tela. Recorte em .faixa--erro. Vale também para T14. -->
<header class="barra barra--admin"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span><a class="barra__link" href="t08-grupos--sucesso.html">Trocar grupo</a></div></header>
<main class="conteudo conteudo--admin">
  <h1 class="titulo-pagina">Times sugeridos</h1>
  <div class="faixa faixa--erro" role="alert"><svg class="icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><p class="faixa__texto">Não foi possível confirmar a escalação. Tente de novo.</p></div>
  <table class="comparativo">
    <caption class="sr">Comparação entre os times</caption>
    <thead><tr><td></td><th scope="col">Time A</th><th scope="col">Time B</th></tr></thead>
    <tbody>
      <tr><th scope="row">Nível no 1º tempo (soma · média)</th><td>44,1 · 6,3</td><td>44,8 · 6,4</td></tr>
      <tr><th scope="row">Nível no 2º tempo (soma · média)</th><td>43,5 · 6,2</td><td>43,7 · 6,2</td></tr>
      <tr><th scope="row">Idade média</th><td>42,3</td><td>41,7</td></tr>
      <tr><th scope="row">Substituições</th><td>2</td><td>2</td></tr>
    </tbody>
  </table>
  <div class="barra-acao"><div class="grupo-botoes"><button class="botao botao--principal" type="button">Confirmar escalação</button><button class="botao botao--secundario" type="button">Refazer sugestão</button><button class="botao botao--texto" type="button">Editar entradas</button></div></div>
</main>
</body>
</html>
