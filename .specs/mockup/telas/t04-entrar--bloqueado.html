<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar (bloqueado)</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<header class="barra"><p class="barra__titulo">Gestão da Pelada</p></header>
<main class="conteudo conteudo--estreito">
  <a class="voltar" href="t01-ranking--sucesso.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>Voltar ao ranking</a>
  <h1 class="titulo-pagina">Entrar</h1>
  <form class="formulario" novalidate>
    <div class="campo"><label class="campo__rotulo" for="email">E-mail</label><input class="campo__entrada" id="email" type="email" autocomplete="username" value="leandro@exemplo.com.br"></div>
    <div class="campo"><label class="campo__rotulo" for="senha">Senha</label><div class="campo__linha"><input class="campo__entrada" id="senha" type="password" autocomplete="current-password"><button class="botao botao--secundario" type="button" aria-pressed="false" aria-controls="senha">Mostrar</button></div></div>
    <p class="campo__ajuda">No iPhone, o app instalado e o Safari pedem login separadamente.</p>
    <div class="faixa faixa--erro" role="alert"><svg class="icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><p class="faixa__texto">Muitas tentativas. Tente de novo em 15 minutos.</p></div>
    <button class="botao botao--principal botao--bloco" type="submit">Entrar</button>
    <a class="botao botao--texto" href="t05-esqueci--vazio.html">Esqueci a senha</a>
  </form>
</main>
</body>
</html>
