<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão – Gestão da Pelada</title>
    <link rel="stylesheet" href="/tokens.css" />
    <style>
      @font-face {
        font-family: 'Barlow';
        font-weight: 400;
        font-display: swap;
        src: url('/fontes/Barlow-400-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Barlow Condensed';
        font-weight: 700;
        font-display: swap;
        src: url('/fontes/BarlowCondensed-700-latin.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--cor-fundo);
        color: var(--cor-texto);
        font-family: var(--fonte-texto);
      }
      .barra {
        background: var(--cor-verde);
        color: var(--cor-sobre-verde);
        padding: var(--esp-3) var(--esp-4);
      }
      .barra p {
        margin: 0;
        font-family: var(--fonte-titulo);
        font-size: var(--texto-2xl);
        font-weight: 700;
        text-transform: uppercase;
      }
      main {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--esp-6) var(--esp-4);
      }
      svg {
        color: var(--cor-verde);
        margin-bottom: var(--esp-3);
      }
      h1 {
        margin: 0 0 var(--esp-2);
        font-family: var(--fonte-titulo);
        font-size: var(--texto-2xl);
        text-transform: uppercase;
      }
      main p {
        margin: 0;
        color: var(--cor-texto-sec);
      }
    </style>
  </head>
  <body>
    <header class="barra"><p>Gestão da Pelada</p></header>
    <main>
      <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10" />
        <path d="M4.9 4.9l14.2 14.2" />
      </svg>
      <h1>Sem conexão</h1>
      <p>Esta página não está disponível sem internet. Conecte-se e tente de novo.</p>
    </main>
  </body>
</html>
